version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # No ignore list: the transitives previously pinned deep by
    # @modelcontextprotocol/sdk, jest, and vitepress (hono, @hono/node-server,
    # body-parser, qs, fast-uri, ip-address, js-yaml, brace-expansion, vite,
    # esbuild, postcss, @babel/core) all resolve to patched versions within
    # their parents' declared semver ranges as of pnpm-lock.yaml — see
    # pnpm.overrides in package.json for the one exception (vite) that needed
    # an explicit override past vitepress's pinned range.
