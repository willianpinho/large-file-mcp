# Dependency policy: SECURITY UPDATES ONLY.
#
# This package IS published to npm, so it has real downstream users — but it is
# not under active feature development, and routine version-bump PRs are queue
# noise. `open-pull-requests-limit: 0` disables Dependabot VERSION updates.
#
# Dependabot SECURITY updates are NOT affected: security PRs are exempt from
# this limit and do not count toward it, so advisories affecting published
# consumers still open PRs. Repo-level Dependabot alerts + automated security
# fixes stay enabled. The `ignore:` block below also governs security updates
# and is preserved verbatim.
#
# To resume version updates: raise the limit back above zero.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    # The transitives previously pinned deep by @modelcontextprotocol/sdk,
    # jest, and vitepress (hono, body-parser, qs, fast-uri, ip-address,
    # js-yaml, brace-expansion, vite, esbuild, postcss, @babel/core) all
    # resolve to patched versions within their parents' declared semver
    # ranges as of pnpm-lock.yaml — see pnpm.overrides in package.json for
    # the one exception (vite) that needed an explicit override past
    # vitepress's pinned range.
    ignore:
      # GHSA-frvp-7c67-39w9 (Windows-only path traversal in serve-static)
      # is patched only from @hono/node-server 2.0.5, which requires
      # Node >=20 — conflicts with this repo's `engines.node >=18.0.0` and
      # the CI matrix's 18.x leg. @modelcontextprotocol/sdk also pins
      # @hono/node-server to ^1.19.9, so a 2.x override fights the SDK's
      # own declared range. No fix available without dropping Node 18
      # support; revisit once the SDK moves to @hono/node-server 2.x or
      # this repo drops Node 18.
      - dependency-name: '@hono/node-server'
